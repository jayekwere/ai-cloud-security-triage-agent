[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cloud-security-triage-agent"
version = "0.1.0"
description = "Evidence-driven cloud security triage with bounded agent tools and human approval"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jonathan Ekwere"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==7.1.0", "ruff==0.13.3", "bandit==1.9.4"]

[project.scripts]
cloudtriage = "cloudtriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudtriage = ["data/*.json", "data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
