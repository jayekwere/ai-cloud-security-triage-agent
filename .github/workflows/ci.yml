name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools; runtime has no dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Security lint and scanner completeness
        run: |
          mkdir -p out
          bandit -r src -f json -o out/bandit.json
          python -c "import json; r=json.load(open('out/bandit.json')); assert not r['errors']; assert r['metrics']['_totals']['loc'] > 500"
      - name: Test trust boundaries and behavior
        run: pytest --cov=cloudtriage --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Offline demo and integrity
        run: |
          cloudtriage demo --out out/demo
          cloudtriage verify-audit out/demo/audit.jsonl
          diff -r examples/demo out/demo
      - name: Dependency consistency
        run: python -m pip check
      - name: Upload synthetic evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-python-${{ matrix.python }}
          path: |
            out/demo/
            out/bandit.json
            coverage.xml
          retention-days: 7
